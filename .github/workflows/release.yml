name: Build & Release BatteryScope DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2

      - name: Build Application & Package DMG
        run: |
          chmod +x build.sh create_dmg.sh
          ./build.sh
          ./create_dmg.sh

      - name: Create GitHub Release and Upload DMG
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Battery Scope ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/BatteryScope-v1.0.0.dmg
            build/BatteryScope.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
